<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Figtree:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #ffffff;
    color: #111;
    overflow: hidden;
    position: relative;
    font-family: 'Figtree', sans-serif;
  }

  .layout {
    display: flex;
    height: 100%;
  }

  /* Left side — title + logos */
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 56px 48px 56px 64px;
    position: relative;
  }

  /* Green accent bar */
  .left::before {
    content: '';
    position: absolute;
    left: 0;
    top: 40px;
    bottom: 40px;
    width: 5px;
    background: #16a34a;
    border-radius: 0 3px 3px 0;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 0.88;
    letter-spacing: -0.02em;
    font-size: 86px;
    color: #09090b;
  }

  h1 .line1 { display: block; letter-spacing: 0.05em; }
  h1 .line2 { display: block; letter-spacing: 0.02em; }

  .logos {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 32px;
  }

  .logos img {
    width: 28px;
    height: 28px;
    border-radius: 5px;
    object-fit: contain;
    filter: grayscale(1);
    opacity: 0.35;
  }

  /* Right side — data card */
  .right {
    width: 440px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 56px 48px 56px 0;
  }

  .card {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 36px 32px;
  }

  .big-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 64px;
    line-height: 1;
    color: #16a34a;
    letter-spacing: -0.02em;
  }

  .big-label {
    font-size: 15px;
    color: #6b7280;
    margin-top: 4px;
    font-weight: 500;
  }

  .big-label .growth {
    color: #16a34a;
    font-weight: 700;
  }

  .divider {
    height: 1px;
    background: #e5e7eb;
    margin: 24px 0;
  }

  .source-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
  }

  .source-row + .source-row {
    border-top: 1px solid #f3f4f6;
  }

  .source-name {
    font-size: 16px;
    font-weight: 600;
    color: #111;
  }

  .source-count {
    font-size: 16px;
    font-weight: 700;
    color: #111;
  }

  /* Bottom bar */
  .bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px 28px;
  }

  .url {
    font-size: 14px;
    color: #9ca3af;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .site-logo img {
    height: 20px;
    width: auto;
    opacity: 0.3;
  }
</style>
</head>
<body>
  <div class="layout">
    <div class="left">
      <h1>
        <span class="line1">IS AI SENDING</span>
        <span class="line2">ME TRAFFIC?</span>
      </h1>
      <div class="logos">
        <img src="public/llm-logos/chatgpt.png" alt="ChatGPT">
        <img src="public/llm-logos/perplexity.png" alt="Perplexity">
        <img src="public/llm-logos/claude.png" alt="Claude">
        <img src="public/llm-logos/gemini.png" alt="Gemini">
        <img src="public/llm-logos/grok.png" alt="Grok">
        <img src="public/llm-logos/deepseek.png" alt="DeepSeek">
      </div>
    </div>
    <div class="right">
      <div class="card">
        <div class="big-number">163</div>
        <div class="big-label">
          sessions from AI · 90 days
          <span class="growth">(+21%)</span>
        </div>
        <div class="divider"></div>
        <div class="source-row">
          <span class="source-name">ChatGPT</span>
          <span class="source-count">144</span>
        </div>
        <div class="source-row">
          <span class="source-name">Gemini</span>
          <span class="source-count">9</span>
        </div>
        <div class="source-row">
          <span class="source-name">Claude</span>
          <span class="source-count">6</span>
        </div>
      </div>
    </div>
  </div>
  <div class="bottom">
    <span class="url">isaisendingmetraffic.com</span>
    <div class="site-logo">
      <img src="public/isaisendingmetraffic-logo-small.png" alt="Logo">
    </div>
  </div>
</body>
</html>

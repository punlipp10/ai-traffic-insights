<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Figtree:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #ffffff;
    color: #111;
    overflow: hidden;
    position: relative;
    font-family: 'Figtree', sans-serif;
  }

  .layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 52px 64px 0;
  }

  /* Title area — centered */
  .title-area {
    text-align: center;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 0.88;
    letter-spacing: -0.02em;
    font-size: 120px;
    color: #09090b;
  }

  h1 .line1 { display: block; letter-spacing: 0.05em; }
  h1 .line2 { display: block; letter-spacing: 0.02em; }

  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 28px;
  }

  .logos img {
    width: 28px;
    height: 28px;
    border-radius: 5px;
    object-fit: contain;
    filter: grayscale(1);
    opacity: 0.35;
  }

  /* Data row — horizontal stats */
  .data-row {
    display: flex;
    align-items: center;
    gap: 48px;
    margin-top: 40px;
    padding: 28px 48px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 120px;
  }

  .stat-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 48px;
    line-height: 1;
    color: #16a34a;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 14px;
    color: #6b7280;
    margin-top: 4px;
    font-weight: 500;
  }

  .stat-label .growth {
    color: #16a34a;
    font-weight: 700;
  }

  .stat-divider {
    width: 1px;
    height: 48px;
    background: #e5e7eb;
  }

  .source-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 90px;
  }

  .source-stat .source-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1;
    color: #111;
  }

  .source-stat .source-name {
    font-size: 13px;
    font-weight: 600;
    color: #6b7280;
    margin-top: 4px;
  }

  /* Bottom bar */
  .bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 64px 24px;
  }

  .url {
    font-size: 14px;
    color: #9ca3af;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .site-logo img {
    height: 20px;
    width: auto;
    opacity: 0.3;
  }
</style>
</head>
<body>
  <div class="layout">
    <div class="title-area">
      <h1>
        <span class="line1">IS AI SENDING</span>
        <span class="line2">ME TRAFFIC?</span>
      </h1>
      <div class="logos">
        <img src="public/llm-logos/chatgpt.png" alt="ChatGPT">
        <img src="public/llm-logos/perplexity.png" alt="Perplexity">
        <img src="public/llm-logos/claude.png" alt="Claude">
        <img src="public/llm-logos/gemini.png" alt="Gemini">
        <img src="public/llm-logos/grok.png" alt="Grok">
        <img src="public/llm-logos/deepseek.png" alt="DeepSeek">
      </div>
    </div>
    <div class="data-row">
      <div class="stat">
        <span class="stat-number">163</span>
        <span class="stat-label">AI sessions · 90d <span class="growth">(+21%)</span></span>
      </div>
      <div class="stat-divider"></div>
      <div class="source-stat">
        <span class="source-count">144</span>
        <span class="source-name">ChatGPT</span>
      </div>
      <div class="source-stat">
        <span class="source-count">9</span>
        <span class="source-name">Gemini</span>
      </div>
      <div class="source-stat">
        <span class="source-count">6</span>
        <span class="source-name">Claude</span>
      </div>
    </div>
  </div>
  <div class="bottom">
    <span class="url">isaisendingmetraffic.com</span>
    <div class="site-logo">
      <img src="public/isaisendingmetraffic-logo-small.png" alt="Logo">
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Figtree:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #09090b;
    color: #fafafa;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* Subtle gradient overlay */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 40%, rgba(59,130,246,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(139,92,246,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    line-height: 0.88;
    letter-spacing: -0.02em;
    font-size: 108px;
    color: #fafafa;
  }

  h1 .line1 { display: block; letter-spacing: 0.05em; }
  h1 .line2 { display: block; letter-spacing: 0.02em; }

  .subtitle {
    font-family: 'Figtree', sans-serif;
    font-size: 22px;
    color: rgba(250,250,250,0.5);
    max-width: 520px;
    line-height: 1.5;
  }

  .logos {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 8px;
  }

  .logos img {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    object-fit: contain;
    opacity: 0.7;
  }

  .site-logo {
    position: absolute;
    bottom: 32px;
    right: 40px;
    opacity: 0.45;
  }

  .site-logo img {
    height: 28px;
    width: auto;
  }

  .url {
    position: absolute;
    bottom: 36px;
    left: 40px;
    font-family: 'Figtree', sans-serif;
    font-size: 15px;
    color: rgba(250,250,250,0.3);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="content">
    <h1>
      <span class="line1">IS AI SENDING</span>
      <span class="line2">ME TRAFFIC?</span>
    </h1>
    <p class="subtitle">See if ChatGPT, Perplexity, Claude, Gemini and other AI tools are sending visitors to your site</p>
    <div class="logos">
      <img src="public/llm-logos/chatgpt.png" alt="ChatGPT">
      <img src="public/llm-logos/perplexity.png" alt="Perplexity">
      <img src="public/llm-logos/claude.png" alt="Claude">
      <img src="public/llm-logos/gemini.png" alt="Gemini">
      <img src="public/llm-logos/grok.png" alt="Grok">
      <img src="public/llm-logos/deepseek.png" alt="DeepSeek">
    </div>
  </div>
  <div class="url">isaisendingmetraffic.com</div>
  <div class="site-logo">
    <img src="public/isaisendingmetraffic-logo-small.png" alt="Logo">
  </div>
</body>
</html>
